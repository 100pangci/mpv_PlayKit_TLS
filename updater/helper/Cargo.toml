[package]
name = "playkit-updater"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Transactional updater for the portable mpv PlayKit distribution"
publish = false

[lib]
name = "playkit_updater"
path = "src/lib.rs"

[[bin]]
name = "playkit-updater"
path = "src/main.rs"

[[bin]]
name = "umpv"
path = "src/bin/umpv.rs"

[dependencies]
# rustls + the OS trust store: no OpenSSL runtime dependency, but corporate
# root certificates installed in the OS store still work.
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "gzip", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "unwind"
