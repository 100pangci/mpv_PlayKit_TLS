# mpv_PlayKit (TLS) - automatic profiles
#
# Only built-in mpv options are used.  Filter, VapourSynth and shader profiles
# are intentionally absent.

[speed_limit_low]
profile-desc = Keep playback speed in a usable range (lower bound)
profile-cond = p.speed < 0.1
speed = 0.1

[speed_limit_high]
profile-desc = Keep playback speed in a usable range (upper bound)
profile-cond = p.speed > 8
speed = 8

[ontop_playback]
profile-desc = Optionally keep the window on top during playback
# profile-cond = not pause and not p.idle_active
profile-restore = copy
ontop = yes

[vsync_auto]
profile-desc = Use audio sync when frame rate and display rate do not match
profile-cond = p.container_fps > 32 or (p.display_fps / p.container_fps) > 3.2 or p.speed ~= 1
profile-restore = copy
interpolation = no
video-sync = audio

[deband_bitrate]
profile-desc = Enable deband automatically for low-bitrate sources
profile-cond = ((p.file_size / 1024) * 8) / p.duration <= 3000
profile-restore = copy
deband = yes

[save_props_auto]
profile-desc = Skip resume state for short, image or near-finished files
profile-cond = p.percent_pos >= 90 or p.duration <= 300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
profile-restore = copy
save-position-on-quit = no

[hdr_generic]
profile-desc = Conservative HDR defaults; no tone-mapping curve is forced
profile-cond = p["video-params/sig-peak"] > 1
profile-restore = copy
blend-subtitles = no
hdr-reference-white = 100
hdr-peak-percentile = 99.99
