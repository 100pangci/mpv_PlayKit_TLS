# ---- Hardware media keys --------------------------------------------------
POWER            quit
PLAY             set pause no
PAUSE            set pause yes
PLAYPAUSE        cycle pause
STOP             stop
REWIND           seek -30 ; script-message-to uosc flash-timeline
FORWARD          seek 30 ; script-message-to uosc flash-timeline
PREV             script-binding uosc/prev
NEXT             script-binding uosc/next

# ---- View manipulation ----------------------------------------------------
Alt+MBTN_LEFT    script-binding positioning/drag-to-pan
Alt+WHEEL_DOWN   script-binding positioning/cursor-centric-zoom -0.1
Alt+WHEEL_UP     script-binding positioning/cursor-centric-zoom 0.1
BS               no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置画面缩放与平移"
