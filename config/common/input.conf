# mpv_PlayKit (TLS) - key bindings and uosc menu
#
# Filter, VapourSynth and GLSL shader entries are intentionally absent.

# ---- Loading --------------------------------------------------------------
Ctrl+Shift+v     script-binding uosc/paste-to-open          #! 加载 > 从剪贴板打开
Ctrl+Shift+o     script-binding uosc/open-file              #! 加载 > 打开文件
#                script-binding uosc/load-subtitles          #! 加载 > 导入字幕
Ctrl+Shift+p     script-binding uosc/paste-to-playlist      #! 加载 > 添加到播放列表

# ---- Playback -------------------------------------------------------------
SPACE            cycle pause                                #! 播放 > 播放/暂停
ENTER            set fullscreen yes                         #! 播放 > 全屏
f                cycle fullscreen
ESC              set fullscreen no
Ctrl+q           quit                                       #! 播放 > 退出

LEFT             seek -5 ; script-message-to uosc flash-timeline
RIGHT            seek 5 ; script-message-to uosc flash-timeline
UP               set pause yes ; seek -1 exact ; script-message-to uosc flash-timeline
DOWN             set pause yes ; seek 1 exact ; script-message-to uosc flash-timeline
,                frame-back-step                            #! 播放 > 上一帧
.                frame-step                                 #! 播放 > 下一帧
l                ab-loop                                    #! 播放 > 设置/清除 AB 循环

[                no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-speed
]                no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-speed
{                no-osd add speed -0.1 ; script-message-to uosc flash-speed
}                no-osd add speed 0.1 ; script-message-to uosc flash-speed
#                set speed 0.5 ; script-message-to uosc flash-speed #! 播放 > 速度 > 50%
#                set speed 1 ; script-message-to uosc flash-speed   #! 播放 > 速度 > 100%
#                set speed 1.5 ; script-message-to uosc flash-speed #! 播放 > 速度 > 150%
#                set speed 2 ; script-message-to uosc flash-speed   #! 播放 > 速度 > 200%
-                no-osd add volume -1 ; script-message-to uosc flash-volume
=                no-osd add volume 1 ; script-message-to uosc flash-volume
m                cycle mute                                 #! 播放 > 静音

# ---- Tracks and sync ------------------------------------------------------
a                cycle aid                                   #! 轨道 > 音频轨
s                cycle sid                                   #! 轨道 > 字幕轨
z                add sub-delay -0.1                          #! 轨道 > 字幕预载 100ms
x                add sub-delay 0.1                           #! 轨道 > 字幕延迟 100ms
c                add audio-delay -0.1                        #! 轨道 > 音频预载 100ms
v                add audio-delay 0.1                         #! 轨道 > 音频延迟 100ms
Shift+BS         set audio-delay 0 ; set sub-delay 0         #! 轨道 > 重置音字幕同步

# ---- Navigation -----------------------------------------------------------
Ctrl+p           script-binding uosc/playlist                #! 导航 > 播放列表
Ctrl+i           script-binding uosc/keybinds                #! 工具 > 按键绑定列表
Ctrl+UP          script-binding uosc/prev                    #! 导航 > 上一个文件
Ctrl+DOWN        script-binding uosc/next                    #! 导航 > 下一个文件
MBTN_BACK        script-binding uosc/prev
MBTN_FORWARD     script-binding uosc/next
MBTN_RIGHT       script-binding uosc/menu                    #! 菜单
MBTN_LEFT_DBL    cycle fullscreen
Ctrl+MBTN_RIGHT  context-menu
Alt+ENTER        cycle fullscreen

# ---- Screenshots ----------------------------------------------------------
Ctrl+s           screenshot scaled+subtitles                 #! 截屏 > 窗口（无 OSD）
Ctrl+S           screenshot window                           #! 截屏 > 窗口
#                screenshot video                             #! 截屏 > 原始画面

# ---- Video ----------------------------------------------------------------
#                cycle-values hwdec "auto" "auto-copy" "no"  #! 视频 > 切换解码模式
#                cycle deband                                 #! 视频 > 切换去色带
#                cycle deinterlace                            #! 视频 > 切换去隔行
#                cycle icc-profile-auto                       #! 视频 > 切换自动校色
#                cycle correct-pts                            #! 视频 > 切换时间码解析

1                add contrast -1                             #! 视频 > 均衡器 > 对比度 -
2                add contrast 1                               #! 视频 > 均衡器 > 对比度 +
3                add brightness -1                           #! 视频 > 均衡器 > 亮度 -
4                add brightness 1                             #! 视频 > 均衡器 > 亮度 +
5                add gamma -1                                #! 视频 > 均衡器 > 伽马 -
6                add gamma 1                                 #! 视频 > 均衡器 > 伽马 +
7                add saturation -1                           #! 视频 > 均衡器 > 饱和度 -
8                add saturation 1                             #! 视频 > 均衡器 > 饱和度 +
9                add hue -1                                  #! 视频 > 均衡器 > 色相 -
0                add hue 1                                   #! 视频 > 均衡器 > 色相 +
Ctrl+BS          set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0 #! 视频 > 均衡器 > 重置

# ---- Tools ----------------------------------------------------------------
I                script-binding display-stats-toggle          #! 工具 > 统计信息
`                script-binding commands/open                 #! 工具 > 控制台
Ctrl+r           script-message-to save_global_props clean_data #! 工具 > 清除已保存属性
g                ignore
g-m              script-binding select/menu                  #! 工具 > select 总菜单
g-p              script-binding select/show-properties       #! 工具 > 属性列表
#                script-binding uosc/audio-device              #! 工具 > 音频输出设备
#                script-binding uosc/show-in-directory         #! 工具 > 打开文件所在目录
#                script-binding uosc/open-config-directory     #! 工具 > 打开配置目录
#                script-binding input_plus/input_test_toggle   #! 工具 > 按键名检测
#                cycle border                                  #! 工具 > 切换窗口边框
#                cycle ontop                                   #! 工具 > 切换窗口置顶
#                script-binding thumbfast/toggle               #! 工具 > 开/关缩略图预览
#                script-binding thumbfast/rerun                #! 工具 > 重试缩略图

# ---- PlayKit update checker ----------------------------------------------
Ctrl+u           script-binding update-check/check-now        #! 更新 > 立即检查更新
#                script-binding update-check/install-now      #! 更新 > 下载并安装更新
#                script-binding update-check/capture-now      #! 更新 > 保存当前配置修改
#                script-binding update-check/repair-now       #! 更新 > 立即重新应用配置 patch
#                script-binding update-check/rollback         #! 更新 > 回滚到上一版本
#                script-binding update-check/open-release       #! 更新 > 打开 Release 页面
#                script-binding update-check/snooze             #! 更新 > 稍后提醒
#                script-binding update-check/disable            #! 更新 > 关闭更新检查
#                script-binding update-check/reset              #! 更新 > 恢复更新检查

# ---- About ----------------------------------------------------------------
