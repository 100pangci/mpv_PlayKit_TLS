# mpv PlayKit (TLS) - key bindings and uosc menu
#
# Filter, VapourSynth and GLSL shader entries are intentionally absent: this
# distribution ships no filters, shaders, models or runtimes.  The `#!` comments
# are uosc menu metadata, not mpv comments; `#! ---` inserts a separator.

# ---- uosc menu: 加载 -------------------------------------------------------
#              script-binding uosc/open-file                         #! 加载 > 打开文件
Ctrl+Shift+v   update-clipboard text; loadfile ${clipboard/text}    #! 加载 > 剪贴板URL
#              script-binding uosc/load-subtitles                    #! 加载 > 导入字幕轨

# ---- uosc menu: 导航 -------------------------------------------------------
#              script-binding uosc/playlist                          #! 导航 > 播放列表
#              script-binding uosc/editions                          #! 导航 > 版本列表
#              script-binding uosc/chapters                          #! 导航 > 章节列表
#              script-binding uosc/video                             #! 导航 > 视频轨列表
#              script-binding uosc/audio                             #! 导航 > 音频轨列表
#              script-binding uosc/subtitles                         #! 导航 > 字幕轨列表
#              playlist-shuffle                                      #! 导航 > 播放列表乱序重排

# ---- uosc menu: 播放 -------------------------------------------------------
,              frame-back-step                                        #! 播放 > 上一帧
.              frame-step                                             #! 播放 > 下一帧
l              ab-loop                                                #! 播放 > 设置/清除 AB循环点
[              no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-speed   #! 播放 > 切换 速度 -
]              no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-speed   #! 播放 > 切换 速度 +
{              no-osd add speed -0.1 ; script-message-to uosc flash-speed                   #! 播放 > 切换 速度 -0.1
}              no-osd add speed 0.1 ; script-message-to uosc flash-speed                    #! 播放 > 切换 速度 +0.1
-              no-osd add volume -1 ; script-message-to uosc flash-volume                   #! 播放 > 音量 -
=              no-osd add volume 1 ; script-message-to uosc flash-volume                    #! 播放 > 音量 +
#              ignore                                                #! 播放 > ---
c              add audio-delay -0.1                                   #! 播放 > 音频预载 100ms
v              add audio-delay 0.1                                    #! 播放 > 音频延迟 100ms
z              add sub-delay -0.1                                     #! 播放 > 字幕预载 100ms
x              add sub-delay 0.1                                      #! 播放 > 字幕延迟 100ms
#              ignore                                                #! 播放 > ---
Shift+BS       set audio-delay 0 ; set sub-delay 0                    #! 播放 > 重置 音频与字幕同步

# ---- uosc menu: 截屏 -------------------------------------------------------
Ctrl+s         screenshot scaled+subtitles                            #! 截屏 > 窗口-无OSD
Ctrl+S         screenshot window                                      #! 截屏 > 窗口
#              screenshot video                                      #! 截屏 > 原始

# ---- uosc menu: 视频 -------------------------------------------------------
#              cycle-values hwdec "auto" "auto-copy" "no"            #! 视频 > 切换 解码模式
#              cycle deband                                          #! 视频 > 切换 去色带状态
#              cycle deinterlace                                     #! 视频 > 切换 去隔行状态
#              cycle icc-profile-auto                                #! 视频 > 切换 自动校色
#              cycle correct-pts                                     #! 视频 > 切换 时间码解析模式
1              add contrast -1                                        #! 视频 > 均衡器 > 对比度 -
2              add contrast 1                                         #! 视频 > 均衡器 > 对比度 +
3              add brightness -1                                     #! 视频 > 均衡器 > 亮度/明度 -
4              add brightness 1                                      #! 视频 > 均衡器 > 亮度/明度 +
5              add gamma -1                                          #! 视频 > 均衡器 > 伽马 -
6              add gamma 1                                           #! 视频 > 均衡器 > 伽马 +
7              add saturation -1                                     #! 视频 > 均衡器 > 饱和度/纯度 -
8              add saturation 1                                      #! 视频 > 均衡器 > 饱和度/纯度 +
9              add hue -1                                            #! 视频 > 均衡器 > 色相 -
0              add hue 1                                             #! 视频 > 均衡器 > 色相 +
#              ignore                                                #! 视频 > 均衡器 > ---
Ctrl+BS        set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0 #! 视频 > 均衡器 > 重置 全部

# ---- uosc menu: 工具 -------------------------------------------------------
Ctrl+i         script-binding uosc/keybinds                           #! 工具 > 按键绑定列表
I              script-binding display-stats-toggle                    #! 工具 > 常驻显示统计信息
`              script-binding commands/open                           #! 工具 > 显示OSD命令行/控制台
Ctrl+r         script-message-to save_global_props clean_data         #! 工具 > 清除已记录的属性值
#              cycle border                                          #! 工具 > 切换 窗口边框
#              cycle ontop                                           #! 工具 > 切换 窗口置顶
#              script-binding input_plus/input_test_toggle           #! 工具 > 按键名检测
#              script-binding input_plus/info_toggle                 #! 工具 > 信息面板
#              script-binding input_plus/ostime_toggle               #! 工具 > 时间码显示
#              script-binding input_plus/chap_skip_toggle            #! 工具 > 跳过片头片尾
#              script-binding input_plus/quit_wait                   #! 工具 > 退出确认
g              ignore
g-m            script-binding select/menu                             #! 工具 > 打开select总菜单
g-p            script-binding select/show-properties                  #! 工具 > 打开select分菜单-属性列表
#              script-binding uosc/audio-device                       #! 工具 > 音频输出设备列表
#              script-binding uosc/stream-quality                     #! 工具 > 流式传输品质
#              script-binding uosc/show-in-directory                  #! 工具 > 打开 当前文件所在路径
#              script-binding uosc/open-config-directory              #! 工具 > 打开 设置目录

# ---- uosc menu: 更新 -------------------------------------------------------
Ctrl+u         script-binding update-check/check-now                  #! 更新 > 立即检查更新
#              script-binding update-check/install-now                #! 更新 > 下载并安装更新
#              script-binding update-check/capture-now                #! 更新 > 保存当前配置修改
#              script-binding update-check/repair-now                 #! 更新 > 立即重新应用配置 patch
#              script-binding update-check/rollback                   #! 更新 > 回滚到上一版本
#              script-binding update-check/open-release               #! 更新 > 打开 Release 页面
#              script-binding update-check/snooze                     #! 更新 > 稍后提醒
#              script-binding update-check/disable                    #! 更新 > 关闭更新检查
#              script-binding update-check/reset                      #! 更新 > 恢复更新检查

# ---- uosc menu: 关于 -------------------------------------------------------
#              script-message-to input_plus lazy-helper 0            #! 关于 > 项目主页
#              script-message-to input_plus lazy-helper 1            #! 关于 > mpv手册
#              script-message-to input_plus lazy-helper 2            #! 关于 > 中文手册
#              script-message-to input_plus lazy-helper 3            #! 关于 > FAQ
#              script-message-to input_plus lazy-helper 4            #! 关于 > 滤镜指北
#              script-message-to input_plus lazy-helper 5            #! 关于 > 着色器指南
#              ignore                                                #! ---
#              stop                                                  #! 停止
Ctrl+q         quit                                                   #! 退出mpv

# ---- Not shown in the uosc menu -------------------------------------------
# These keys still work while a video is open.  `MBTN_LEFT ignore` and
# `MBTN_RIGHT_DBL ignore` keep uosc's own click handling in charge.

POWER          quit
PLAY           set pause no
PAUSE          set pause yes
PLAYPAUSE      cycle pause
STOP           stop
REWIND         seek -30 ; script-message-to uosc flash-timeline
FORWARD        seek 30 ; script-message-to uosc flash-timeline
PREV           script-binding uosc/prev
NEXT           script-binding uosc/next

MBTN_BACK      script-binding uosc/prev
MBTN_FORWARD   script-binding uosc/next
MBTN_LEFT      ignore
MBTN_LEFT_DBL  cycle fullscreen
MBTN_RIGHT     script-binding uosc/menu
Ctrl+MBTN_RIGHT context-menu
MBTN_RIGHT_DBL ignore

ESC            set fullscreen no
ENTER          set fullscreen yes
Alt+ENTER      cycle fullscreen
SPACE          cycle pause
UP             set pause yes ; seek -1 exact ; script-message-to uosc flash-timeline
DOWN           set pause yes ; seek 1 exact ; script-message-to uosc flash-timeline
LEFT           seek -5 ; script-message-to uosc flash-timeline
RIGHT          seek 5 ; script-message-to uosc flash-timeline
Ctrl+UP        script-binding uosc/prev
Ctrl+DOWN      script-binding uosc/next
Alt+MBTN_LEFT   script-binding positioning/drag-to-pan
BS             no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置 --video-zoom --panscan --video-pan --video-align"
Alt+WHEEL_DOWN script-binding positioning/cursor-centric-zoom -0.1
Alt+WHEEL_UP   script-binding positioning/cursor-centric-zoom 0.1