# dynamic_crop.lua（上游 Ashyni/mpv-scripts，MIT）的 PlayKit 选项覆盖。
#
# 本文件只覆盖默认值，不修改上游脚本。脚本在构建时按 manifests/scripts.yml
# 固定到完整提交下载并校验；完整选项说明见上游 dynamic-crop.lua 文件头。
#
# PlayKit 默认不自动裁切：mode=1 表示“按需启用”，脚本加载后只注册命令，
# 不插入 cropdetect、不修改 video-crop。用 Alt+C 或菜单“视频 > 动态裁切”
# 切换；上游同时保留 Shift+C。切换顺序为
# 启用检测 -> 保留当前裁切并停止检测 -> 移除裁切。

mode=1
# 使用 mpv 的 video-crop 属性应用结果（1），不向用户 vf 链插入 crop 滤镜；
# GLSL shader、字幕和手动滤镜保持原样。
crop_method=1

# cropdetect 阈值：低于该亮度视为黑边。画面黑边偏灰时可逐步提高。
detect_limit=26
# 检测宽高向下取整的倍数（必须是偶数）。
detect_round=2

# 检测时间参数（秒）：新的宽高比需要在时间窗口内稳定累计才会被采用。
fast_change_timer=0.2
ratio_timer=2
offset_timer=20
fallback_timer=40
# 允许的宽高比误差与结果分段比例，用于抑制暗场/渐变的误检和抖动。
linked_tolerance=2
ratio_tolerance=2
segmentation=0.5

# 裁切变化时避免窗口被自动缩放到新的视频尺寸。
fix_windowed_behavior=1
# 采用新比例后的一段时间内不上报更新，降低抖动。
prevent_change_timer=30
# 0=不限制；需要锁定超宽屏比例时可改为 1/2/3 对应上游说明。
prevent_change_mode=0

# 上游要求的硬解模式：hwdec=no 或 *-copy。PlayKit 默认 auto-copy，
# 脚本会自行检测；不会修改用户的 hwdec 设置。
