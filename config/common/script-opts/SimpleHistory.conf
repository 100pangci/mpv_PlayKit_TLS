# mpv PlayKit overrides for SimpleHistory.
#
# The upstream script is fetched at build time (Eisa01/mpv-scripts,
# BSD-2-Clause).  Only options that differ from the upstream defaults are
# listed here.  The log lives under user/data so the updater preserves it.
#
# watch_later remains the normal mpv resume mechanism.  Automatic history
# resume is therefore disabled; Ctrl+Alt+r resumes the last history entry
# explicitly, and Ctrl+Alt+h opens the history list.

auto_run_list_idle=none
startup_idle_behavior=none
resume_option=none
same_entry_limit=5
log_file=user/data/mpvHistory.log

history_resume_keybind=["ctrl+alt+r", "ctrl+alt+R"]
history_load_last_keybind=["alt+r", "alt+R"]
history_incognito_mode_keybind=["ctrl+shift+i", "ctrl+shift+I"]
open_list_keybind=[ ["ctrl+alt+h", "all"], ["ctrl+alt+H", "all"] ]
