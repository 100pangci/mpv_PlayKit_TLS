# input_plus.lua options
#
# Set load=no to skip the whole script.  The other values tune OSD lifetimes
# and the optional helpers; defaults match the upstream behaviour.

load=yes
# Seconds an informational OSD stays visible.
osd_duration=2
# Refresh period of the information panel, in seconds.
info_refresh=2
# Chapter titles matching these patterns are skipped by "跳过片头片尾".
chapter_keywords=OP$,opening$,ED$,ending$,オープニング$,エンディング$
# Temporary playlist used by the save/load bindings; ~~ is mpv's config dir.
playlist_temp=~~/playlist_temp.mpl
# Hold-to-play rate for input_plus/speed_autox and the adaptive speed helper.
speed_target=3
speed_iterations=10
speed_delta_max=0.5
speed_delta_min=0.0005