# screenshot_tools.lua 选项
#
# mpv PlayKit 的原创截图工具：video/subtitles/window 三种模式、临时矩形裁剪、
# 连拍，以及优先使用随包 mpv 的图片拼接（仅在必要时回退到 PATH 中的 ffmpeg）。
#
# 默认输出目录和连拍队列位于 portable_config/user/ 下，版本更新不会覆盖用户
# 数据。截图质量沿用 mpv 当前的 screenshot-* 属性，本脚本不会修改它们。

enabled=yes
# 截图输出目录。默认放在用户层；portable_config 之外的路径也可以（例如
# ~~desktop）。配置目录内除 user/ 以外的位置会被拒绝，以免污染随包文件。
directory=~~/user/screenshots
# 连拍使用的追加式 JSONL 队列，供“拼接最近一次连拍”读取。
queue_file=~~/user/screenshot-tools/queue.jsonl
filename_prefix=PlayKit
# png、jpg 或 webp；jpeg 会被当作 jpg 的别名。
format=png
# 绑定未指定模式时使用的默认模式：video、subtitles 或 window。
default_mode=subtitles
# screenshot_tools/region 未传入坐标时使用的备用区域，格式 x:y:w:h。
region=
# 应用临时 video-crop 后等待画面刷新的秒数，然后发出截图命令。
capture_delay=0.2
# 等待 screenshot-to-file 完成写盘的最长秒数。
file_timeout=10
# 连拍默认值；连拍绑定的参数可以覆盖数量、间隔和模式。
burst_count=5
burst_interval=1.0
burst_mode=subtitles
# 用户传入连拍数量时的安全上限（1-1000）。
burst_max_count=200
# 拼接方向：hstack（横向并排）或 vstack（纵向堆叠）。
stitch_direction=hstack
# 随包 mpv 的显式路径。留空时自动查找便携包中的 mpv
# （Windows: ../mpv.exe，Linux: ../mpv/bin/mpv）。
mpv_path=
# 仅当随包 mpv 缺失或拼接失败时才使用 ffmpeg。裸命令名会在 PATH 中查找，
# 绝对路径则直接使用。
ffmpeg_path=ffmpeg
# 单个拼接子进程的硬超时时间，单位为秒。
subprocess_timeout=120
