enabled=yes
max_width=270
max_height=270
min_duration=30
precise=5
network=yes
cache_dir=~~/_cache/thumbfast
timeout_seconds=15
# Hardware decoding for the thumbnail subprocess only.  "no" is the safest
# default; "auto-safe" or "auto-copy" can make 4K thumbnails cheaper.
thumbnail_hwdec=no
# Disk cache housekeeping: keep at most this many thumbnails and delete entries
# older than max_cache_age_days (0 disables the age limit).  Cleanup runs at
# most once per cache_cleanup_interval seconds.
max_cache_files=400
max_cache_age_days=30
cache_cleanup_interval=300
# After failure_limit consecutive subprocess failures, pause thumbnails for
# retry_seconds instead of disabling them for the rest of the session.
failure_limit=3
retry_seconds=60