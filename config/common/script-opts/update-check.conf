# Set enabled=no to disable the PlayKit update checker completely.
# When disabled the script never spawns curl/wget or the updater helper,
# never downloads anything and never touches the network.
enabled=yes
repository=100pangci/mpv_PlayKit_TLS
check_interval_hours=24
timeout_seconds=12
snooze_hours=24

# In-player installation is manual: automatic checks never install anything.
# Set install_enabled=no to hide/refuse installation while keeping checks.
install_enabled=yes

# How direct edits to the official config are handled during installation:
#   capture  save them as user/patches/auto and re-apply after updating
#   discard  ignore them and start from the new official configuration
#   abort    refuse to install if unmanaged edits are found
unmanaged=capture

# Restart the player after a successful install/rollback: auto, yes or no.
# "auto" restarts only when the update was launched from the running player.
relaunch=auto

# Seconds the updater waits for the player to exit before installing.
# The helper stages and verifies everything first; the OSD tells the user
# that the update will be installed after the player exits.
wait_timeout=600
