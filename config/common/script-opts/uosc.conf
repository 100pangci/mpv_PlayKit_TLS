# uosc is fetched unmodified from its official release.  Only public options
# documented by uosc are used here; the thumbnail provider is our local
# scripts/thumbfast.lua (uosc 5.13 calls the script named "thumbfast").

languages=slang,zh-hans,zh,en
controls=menu,gap,play-pause,gap,subtitles,audio,<has_chapter>chapters,<has_many_edition>editions,<has_many_video>video,<stream>stream-quality,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
top_bar=no-border
top_bar_title=yes
autoload=yes
default_directory=~/
timeline_step=5
menu_type_to_search=yes
destination_time=playtime-remaining

video_types=avi,flv,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv
audio_types=aac,ac3,ape,dsf,dts,flac,m4a,mka,mp3,ogg,opus,wav,wma,wv
image_types=apng,avif,bmp,gif,jfif,jpeg,jpg,jxl,png,svg,tif,tiff,webp
subtitle_types=ass,idx,lrc,mks,pgs,sup,srt,ssa,txt,vtt
