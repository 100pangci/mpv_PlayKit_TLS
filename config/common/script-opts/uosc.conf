# uosc is fetched from its official release; the build applies one small patch
# to main.lua (build/patch_uosc.py) that adds the automatic UI scale used below.
# All other uosc files remain upstream.  The rest of the options here are
# public uosc options; the thumbnail provider is our local
# scripts/thumbfast.lua (uosc 5.13 calls the script named "thumbfast").

languages=slang,zh-hans,zh,en
# 0 = automatic: the shorter side of the current display maps to 100%
# (1080p -> 1.0), recomputed when the window moves to another display.
# Any positive value keeps uosc's stock behaviour (multiplied by the OS DPI
# factor).
scale=0
scale_fullscreen=1
# Visual parity with the baseline: thin window border, tighter text layout and
# the timeline/menu opacity used by its uosc defaults.
window_border_size=2
refine=text_width,sorting
load_types=video
adjust_osd_margins=false
opacity=timeline=0.5,slider=0.8,menu=0.8,submenu=0.6,curtain=0.5
color=curtain=000000
# The baseline keeps the bottom bar and timeline visible on the idle screen.
# Custom buttons mirror the baseline layout without modifying uosc itself.
controls=menu,command:info_outline:script-binding display-stats-toggle?统计信息,command:panorama:script-binding thumbfast/toggle?缩略图,gap,cycle:not_started:pause:no=play_circle/yes=pause_circle?播放/暂停,gap,subtitles,audio,<has_chapter>chapters,<has_many_edition>editions,<has_many_video>video,<stream>stream-quality,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_persistency=idle,audio
timeline_persistency=idle,audio
speed_persistency=idle,audio
top_bar_persistency=idle,audio
timeline_step=1
top_bar=no-border
top_bar_title=yes
# Our own idle screen (scripts/local/idle-brand.lua) replaces uosc's default
# play icon and "Drop files or URLs" text.
disable_elements=idle_indicator
# Keep the right-side volume bar visible on the idle screen, matching the
# baseline layout.  During playback it still follows proximity/hover.
volume=right
volume_persistency=idle,audio
autoload=yes
default_directory=~/
menu_type_to_search=yes
destination_time=total

video_types=avi,flv,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv
audio_types=aac,ac3,ape,dsf,dts,flac,m4a,mka,mp3,ogg,opus,wav,wma,wv
image_types=apng,avif,bmp,gif,jfif,jpeg,jpg,jxl,png,svg,tif,tiff,webp
subtitle_types=ass,idx,lrc,mks,pgs,sup,srt,ssa,txt,vtt
