# mpv PlayKit overrides for SimpleBookmark.
#
# The upstream script is fetched at build time (Eisa01/mpv-scripts,
# BSD-2-Clause).  Bookmarks are stored under user/data so the updater
# preserves them.  Ctrl+Alt+1 is used for the optional "收藏" group so the
# shader shortcuts on Ctrl+1..9 remain untouched.

auto_run_list_idle=none
load_item_on_startup=0
preserve_video_settings=no
log_file=user/data/mpvBookmark.log

bookmark_save_keybind=["ctrl+b", "ctrl+B"]
bookmark_fileonly_keybind=["alt+b", "alt+B"]
open_list_keybind=[ ["b", "all"], ["B", "all"], ["k", "keybinds"], ["K", "keybinds"] ]
groups_list_and_keybind=[ ["收藏", "ctrl+alt+1"] ]
