# pip.lua 配置（mpv PlayKit 原创画中画模块）
#
# 进入画中画时只临时修改窗口相关属性，退出时会恢复进入前的原值。
# 修改本文件后重新加载脚本或重启 mpv 生效。

# 是否启用画中画脚本；no 时不注册任何命令和快捷键
enabled=yes

# 小窗所在的屏幕角落：bottom-right、bottom-left、top-right、top-left
position=bottom-right

# 小窗宽度占屏幕宽度的百分比（1-100）
width_percent=25

# 小窗高度占屏幕高度的百分比；0 表示按当前视频宽高比自动计算
height_percent=0

# 小窗与屏幕边缘的间距（像素）
margin=16

# 小窗的最小宽度（像素），避免百分比过小时窗口不可用
min_width=160

# 进入画中画时是否置顶
ontop=yes

# 进入画中画时是否隐藏窗口边框
border=no

# 进入画中画前是否先退出全屏
exit_fullscreen=yes

# 显示器分辨率或缩放变化时是否重新计算小窗位置
follow_display=yes

# 切换视频时是否按新视频的宽高比重新计算小窗大小
keep_on_new_file=yes

# 切换画中画的快捷键；留空表示只注册命令，不注册按键
toggle_keybind=alt+p
