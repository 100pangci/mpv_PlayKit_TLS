# Native context menu (Ctrl+MBTN_RIGHT).  This is a configuration file for
# mpv's built-in `context-menu` command, not a script.  Filter, VapourSynth and
# shader entries are intentionally absent.

显示 uosc 菜单	script-binding uosc/menu

加载
	从剪贴板打开	update-clipboard text; loadfile ${clipboard/text}; show-text "+ ${clipboard/text}"
	打开文件	script-binding uosc/open-file
	导入字幕	script-binding uosc/load-subtitles
	轨道聚合列表	$tracks

导航
	播放列表	$playlist
	版本列表	$editions
	章节列表	$chapters
	视频轨列表	$video-tracks
	音频轨列表	$audio-tracks
	字幕轨列表	$sub-tracks
	播放列表乱序重排	playlist-shuffle

播放
	上一帧	frame-back-step
	下一帧	frame-step
	设置/清除 AB 循环点	ab-loop
	速度
		50%	set speed 0.5	checked=speed == 0.5
		100%	set speed 1	checked=speed == 1
		150%	set speed 1.5	checked=speed == 1.5
		200%	set speed 2	checked=speed == 2
	音量 -	add volume -1
	音量 +	add volume 1
	音频预载 100ms	add audio-delay -0.1
	音频延迟 100ms	add audio-delay 0.1
	字幕预载 100ms	add sub-delay -0.1
	字幕延迟 100ms	add sub-delay 0.1
	重置音频与字幕同步	set audio-delay 0; set sub-delay 0

截屏
	窗口（无 OSD）	screenshot scaled+subtitles
	窗口	screenshot window
	原始画面	screenshot video

视频
	切换解码模式	cycle-values hwdec "auto" "auto-copy" "no"
	切换去色带	cycle deband	checked=deband
	切换去隔行	cycle deinterlace	checked=deinterlace_active
	切换自动校色	cycle icc-profile-auto
	切换时间码解析	cycle correct-pts
	均衡器
		对比度 -	add contrast -1
		对比度 +	add contrast 1
		亮度 -	add brightness -1
		亮度 +	add brightness 1
		伽马 -	add gamma -1
		伽马 +	add gamma 1
		饱和度 -	add saturation -1
		饱和度 +	add saturation 1
		色相 -	add hue -1
		色相 +	add hue 1
		重置全部	set contrast 0; set brightness 0; set gamma 0; set saturation 0; set hue 0

工具
	按键绑定列表	script-binding uosc/keybinds
	常驻显示统计信息	script-binding display-stats-toggle
	显示控制台	script-binding commands/open
	清除已保存属性	script-message-to save_global_props clean_data
	切换窗口边框	cycle border	checked=border
	切换窗口置顶	cycle ontop	checked=ontop
	按键名检测	script-binding input_plus/input_test_toggle
	打开 select 总菜单	script-binding select/menu
	打开属性列表	script-binding select/show-properties
	音频输出设备	$audio-devices

关于
	项目主页	script-message-to input_plus lazy-helper 0
	mpv 手册	script-message-to input_plus lazy-helper 1
	中文手册	script-message-to input_plus lazy-helper 2
	FAQ	script-message-to input_plus lazy-helper 3

停止	stop	disabled=idle_active
退出 mpv	quit
