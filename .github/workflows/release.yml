name: Release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      source_sha:
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore Windows package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/out
          key: playkit-package-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          enableCrossOsArchive: true
          compressionMethod: gzip
          fail-on-cache-miss: true
      - name: Restore Linux package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/out
          key: playkit-package-${{ github.run_id }}-${{ github.run_attempt }}-linux-x64
          compressionMethod: gzip
          fail-on-cache-miss: true
      - name: Build release metadata
        run: |
          set -euo pipefail
          python -m build.release \
            --version "${{ inputs.version }}" \
            --tag "${{ inputs.tag }}" \
            --dist dist \
            --lock sources.lock.json \
            --repository "${{ github.repository }}" \
            --out-dir dist/release \
            --source-sha "${{ inputs.source_sha || github.sha }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" \
            "dist/release/mpv-PlayKit-${VERSION}-windows-x64.zip" \
            "dist/release/mpv-PlayKit-${VERSION}-linux-x64.tar.gz" \
            "dist/release/manifest.json" \
            "dist/release/SHA256SUMS" \
            --title "mpv PlayKit ${VERSION}" \
            --notes-file dist/release/release-notes.md \
            --target "$(git rev-parse HEAD)" \
            --latest
