name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version string for a manual build
        required: false
        default: ci
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: false
        default: ""
      # Monthly update passes the exact candidate lock as a workflow artifact.
      # Both platforms verify its sha256 and install it before fetching, so the
      # resolver, both builds and the release all use identical lock bytes.
      lock_artifact:
        type: string
        required: false
        default: ""
      lock_sha256:
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  tests:
    # This repository is public: never execute build scripts from fork PRs
    # automatically.  Same-repository PRs still get the full test suite.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q build tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-x64:
    needs: tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download candidate lock
        if: inputs.lock_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.lock_artifact }}
          path: .work/candidate-lock
      - name: Install verified candidate lock
        if: inputs.lock_artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m build.lockfile \
            --lock .work/candidate-lock/sources.lock.json \
            --sha256 "${{ inputs.lock_sha256 }}"
          cp .work/candidate-lock/sources.lock.json sources.lock.json
      - name: Restore download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/downloads
          key: downloads-windows-${{ inputs.lock_sha256 || hashFiles('sources.lock.json') }}
      - name: Fetch upstream assets
        run: python -m build.fetch --lock sources.lock.json --work .work --platform windows-x64
      - name: Assemble
        run: >-
          python -m build.assemble
          --platform windows-x64
          --version "${{ inputs.version || 'ci' }}"
          --lock sources.lock.json
          --work .work
          --out dist/stage/windows-x64
          --source-sha "${{ inputs.source_sha || github.sha }}"
      - name: Smoke test
        run: python -m build.smoke --stage dist/stage/windows-x64 --platform windows-x64
      - name: Package
        run: >-
          python -m build.package
          --stage dist/stage/windows-x64
          --platform windows-x64
          --version "${{ inputs.version || 'ci' }}"
          --out-dir dist/out
      - name: Verify stage
        run: python -m build.verify --stage dist/stage/windows-x64 --platform windows-x64 --version "${{ inputs.version || 'ci' }}"
      - name: Verify archive
        shell: pwsh
        run: |
          $asset = (Get-ChildItem -Path dist/out -Filter *.zip | Select-Object -First 1).FullName
          python -m build.verify --asset "$asset" --platform windows-x64 --version "${{ inputs.version || 'ci' }}"
      - name: Save package for release
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/out
          key: playkit-package-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          enableCrossOsArchive: true

  linux-x64:
    needs: tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full squashfs-tools
      - name: Download candidate lock
        if: inputs.lock_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.lock_artifact }}
          path: .work/candidate-lock
      - name: Install verified candidate lock
        if: inputs.lock_artifact != ''
        run: |
          set -euo pipefail
          python -m build.lockfile \
            --lock .work/candidate-lock/sources.lock.json \
            --sha256 "${{ inputs.lock_sha256 }}"
          cp .work/candidate-lock/sources.lock.json sources.lock.json
      - name: Restore download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/downloads
          key: downloads-linux-${{ inputs.lock_sha256 || hashFiles('sources.lock.json') }}
      - name: Fetch upstream assets
        run: python -m build.fetch --lock sources.lock.json --work .work --platform linux-x64
      - name: Assemble
        run: >-
          python -m build.assemble
          --platform linux-x64
          --version "${{ inputs.version || 'ci' }}"
          --lock sources.lock.json
          --work .work
          --out dist/stage/linux-x64
          --source-sha "${{ inputs.source_sha || github.sha }}"
      - name: Smoke test
        run: python -m build.smoke --stage dist/stage/linux-x64 --platform linux-x64
      - name: Package
        run: >-
          python -m build.package
          --stage dist/stage/linux-x64
          --platform linux-x64
          --version "${{ inputs.version || 'ci' }}"
          --out-dir dist/out
      - name: Verify stage
        run: python -m build.verify --stage dist/stage/linux-x64 --platform linux-x64 --version "${{ inputs.version || 'ci' }}"
      - name: Verify archive
        run: |
          asset="$(ls dist/out/*.tar.gz | head -n 1)"
          python -m build.verify --asset "$asset" --platform linux-x64 --version "${{ inputs.version || 'ci' }}"
      - name: Save package for release
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/out
          key: playkit-package-${{ github.run_id }}-${{ github.run_attempt }}-linux-x64
          enableCrossOsArchive: true
