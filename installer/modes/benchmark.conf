# Benchmark mode: deterministic, minimal output path.
#
# The Windows launcher (benchmark.cmd) applies bench_api_1 + bench_render_1 by
# default.  The Linux launcher adds --profile=bench_api_3 because d3d11 is not
# available there.  Later --profile options on the command line override these
# defaults, for example:
#
#   benchmark.cmd --profile=bench_api_2 --profile=bench_render_2 sample.mkv
#
# These options intentionally ignore the normal portable configuration.

log-file=mpv-benchmark.log
osd-msg1=Benchmark: ${filename}
opengl-swapinterval=0
opengl-dwmflush=no
vulkan-swap-mode=immediate
d3d11-sync-interval=0
d3d11-flip=no
hidpi-window-scale=no
window-scale=1.5
sub=no
audio=no
keep-open=always
display-fps-override=24
video-sync=display-desync
interpolation=no
profile=bench_api_1
profile=bench_render_1

[bench_api_1]
profile-desc=Benchmark: gpu-next on D3D11, no hardware decoding
vo=gpu-next
gpu-api=d3d11
hwdec=no

[bench_api_2]
profile-desc=Benchmark: gpu-next on Vulkan, no hardware decoding
vo=gpu-next
gpu-api=vulkan
hwdec=no

[bench_api_3]
profile-desc=Benchmark: gpu-next on OpenGL, no hardware decoding
vo=gpu-next
gpu-api=opengl
hwdec=no

[bench_render_1]
profile-desc=Benchmark: resampling with sinc interpolation
video-sync=display-resample
interpolation=yes
tscale=sinc

[bench_render_2]
profile-desc=Benchmark: resampling with Lanczos interpolation
video-sync=display-resample
interpolation=yes
tscale=lanczos