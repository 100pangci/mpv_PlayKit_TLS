schema: 1
# Third-party binaries.  Nothing in this file is committed to the repository;
# the resolver records exact releases and hashes in sources.lock.json and the
# build fetches them on demand.
components:
  - id: mpv-windows
    kind: binary
    platforms: [windows-x64]
    provides: mpv
    upstream: shinchiro/mpv-winbuild-cmake
    release:
      mode: latest
    asset:
      pattern: '^mpv-x86_64-(?P<date>\d{8})-git-(?P<commit>[0-9a-f]+)\.7z$'
      version: '{date}-git-{commit}'
      commit: '{commit}'
      # The asset name only carries mpv's short commit.  Resolve it to the
      # full commit so the lock, manifest and license URLs are unambiguous.
      commit_repository: mpv-player/mpv
    license:
      # The Windows build as a whole is GPL-2.0-or-later; LGPL-covered parts
      # keep their own terms.  Record both scopes instead of implying the
      # LGPL text covers the whole build.
      spdx: GPL-2.0-or-later
      scope: component-aggregate
      parts:
        - license: GPL-2.0-or-later
          scope: 'mpv Windows build as a whole'
        - license: LGPL-2.1-or-later
          scope: 'LGPL-covered parts of mpv'
      files:
        # `ref` is resolved to a full commit at resolve time; the lock and the
        # shipped URL only ever contain that commit, never a branch or tag.
        - path: LICENSE.GPL
          license: GPL-2.0-or-later
          repository: mpv-player/mpv
          ref: '{commit}'
        - path: LICENSE.LGPL
          license: LGPL-2.1-or-later
          repository: mpv-player/mpv
          ref: '{commit}'
    extract:
      type: 7z
      members:
        - mpv.exe
        - mpv.com
        - d3dcompiler_43.dll
    install:
      - source: mpv.exe
        target: mpv.exe
      - source: mpv.com
        target: mpv.com
      - source: d3dcompiler_43.dll
        target: d3dcompiler_43.dll

  - id: mpv-linux
    kind: binary
    platforms: [linux-x64]
    provides: mpv
    upstream: pkgforge-dev/mpv-AppImage
    release:
      mode: tag
      tag: nightly
    asset:
      # nightly assets embed the mpv master commit in the filename.  The stable
      # release uses the same pattern without the -<build>-g<commit> suffix.
      pattern: '^mpv-(?P<version>v[0-9][^-]*(?:-\d+-g(?P<commit>[0-9a-f]+))?)-anylinux-x86_64\.AppImage$'
      version: '{version}'
      commit: '{commit}'
      commit_repository: mpv-player/mpv
    license:
      # The AppImage packaging/runtime and the bundled mpv build carry
      # different licenses; this is not a joint license on a single work.
      spdx: NOASSERTION
      scope: component-aggregate
      parts:
        - license: GPL-3.0-or-later
          scope: 'pkgforge-dev/mpv-AppImage packaging and runtime'
        - license: GPL-2.0-or-later
          scope: 'mpv binary and GPL-covered components'
        - license: LGPL-2.1-or-later
          scope: 'LGPL-covered parts of mpv'
      files:
        # Pin the packaging repository to the commit the nightly tag points at
        # instead of the moving `main` branch.
        - path: LICENSE
          license: GPL-3.0-or-later
          repository: pkgforge-dev/mpv-AppImage
          ref: '{release_tag}'
        # The AppImage contains an mpv build; ship mpv's own license texts too.
        - path: LICENSE.GPL
          license: GPL-2.0-or-later
          repository: mpv-player/mpv
          ref: '{commit}'
        - path: LICENSE.LGPL
          license: LGPL-2.1-or-later
          repository: mpv-player/mpv
          ref: '{commit}'
    extract:
      type: appimage
      # Keep the upstream runtime compatibility hooks (CA certificates, path
      # mapping, namespaces).  Only remove hooks that would self-update the
      # AppImage or download another yt-dlp at runtime.
      remove_hooks:
        - '*self-update*.hook'
        - '*yt-dlp*.hook'
    install:
      - source: .
        target: mpv
        tree: true

  - id: yt-dlp-windows
    kind: binary
    platforms: [windows-x64]
    upstream: yt-dlp/yt-dlp
    release:
      mode: latest
    asset:
      pattern: '^yt-dlp\.exe$'
      version: '{release_tag}'
    license:
      spdx: Unlicense
      files:
        - path: LICENSE
          license: Unlicense
          repository: yt-dlp/yt-dlp
          ref: '{release_tag}'
        - path: THIRD_PARTY_LICENSES.txt
          license: NOASSERTION
          repository: yt-dlp/yt-dlp
          ref: '{release_tag}'
    install:
      - source: yt-dlp.exe
        target: yt-dlp.exe

  - id: yt-dlp-linux
    kind: binary
    platforms: [linux-x64]
    upstream: yt-dlp/yt-dlp
    release:
      mode: latest
    asset:
      pattern: '^yt-dlp_linux$'
      version: '{release_tag}'
    license:
      spdx: Unlicense
      files:
        - path: LICENSE
          license: Unlicense
          repository: yt-dlp/yt-dlp
          ref: '{release_tag}'
        - path: THIRD_PARTY_LICENSES.txt
          license: NOASSERTION
          repository: yt-dlp/yt-dlp
          ref: '{release_tag}'
    install:
      - source: yt-dlp_linux
        target: yt-dlp
        executable: true
