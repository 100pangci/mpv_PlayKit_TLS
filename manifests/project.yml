schema: 1
name: mpv_PlayKit_TLS
display_name: mpv PlayKit
description: Portable mpv distribution for Windows and Linux, assembled automatically from pinned upstream releases.
repository: 100pangci/mpv_PlayKit_TLS

release:
  tag_prefix: v
  version_scheme: calendar-month
  make_latest: true
  prerelease: false

platforms:
  windows-x64:
    archive: zip
    runner: windows-latest
  linux-x64:
    archive: tar.gz
    runner: ubuntu-24.04

paths:
  config: config
  local_scripts: scripts/local
  updater: updater/update-check.lua
