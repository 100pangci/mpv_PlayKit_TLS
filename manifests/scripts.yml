schema: 1
# Upstream scripts and their assets.  uosc is fetched from its official
# release; the build applies one small, documented patch to
# portable_config/scripts/uosc/main.lua (build/patch_uosc.py) that adds the
# automatic UI scale.  All other uosc files remain upstream; see THIRD_PARTY.md.
# Local scripts live in scripts/local/ instead.
components:
  # Eisa01's history and bookmark scripts are fetched as immutable raw files
  # and pinned to one upstream commit.  Their repository declares BSD-2-Clause;
  # build.script_update refreshes the commit/file hashes and refuses to accept
  # a changed license text automatically.  PlayKit ships its own overrides in
  # config/common/script-opts/ so the data paths and key bindings fit this
  # distribution.
  - id: eisa01-mpv-scripts
    kind: raw-files
    platforms: all
    upstream: Eisa01/mpv-scripts
    ref: b9e63743a858766c9cc7a801d77313b0cecdb049
    version: "2025-06-21"
    update:
      mode: latest-commit
      license_marker: "BSD 2-Clause License"
    files:
      - source: scripts/SimpleHistory.lua
        target: portable_config/scripts/SimpleHistory.lua
        sha256: 1cbaf6dc3855ebb4b7f92a69c48ba6b704b19585eaa3ee180e84dfa66f2d0520
        license: BSD-2-Clause
      - source: scripts/SimpleBookmark.lua
        target: portable_config/scripts/SimpleBookmark.lua
        sha256: 5bfd416814b7a85e8c6dd5d461a28f93d29379acf3b47fb97f80e52a0e7157b8
        license: BSD-2-Clause
    license:
      spdx: BSD-2-Clause
      files:
        - path: LICENSE
          license: BSD-2-Clause
          repository: Eisa01/mpv-scripts
          ref: b9e63743a858766c9cc7a801d77313b0cecdb049

  # Ashyni's dynamic-crop.lua is the original upstream of the script bundled by
  # dyphire/mpv-config (MIT).  It is fetched at build time and pinned to one
  # commit; PlayKit ships only option overrides that keep the default disabled.
  - id: ashyni-dynamic-crop
    kind: raw-files
    platforms: all
    upstream: Ashyni/mpv-scripts
    ref: d3f5685f5209ae548f8398b21d4dcbbea766d076
    version: "2024-09-14"
    update:
      mode: latest-commit
      license_marker: "This script uses the lavfi cropdetect filter"
    files:
      - source: dynamic-crop.lua
        target: portable_config/scripts/dynamic_crop.lua
        sha256: 332f314b324617d7038c00c3ada08d257160e10766c801800dbdea325fe11022
        license: MIT
    license:
      spdx: MIT
      files:
        - path: LICENSE
          license: MIT
          repository: Ashyni/mpv-scripts
          ref: d3f5685f5209ae548f8398b21d4dcbbea766d076

  - id: uosc
    kind: archive
    platforms: all
    upstream: tomasklaen/uosc
    release:
      mode: latest
    asset:
      pattern: '^uosc\.zip$'
      version: '{release_tag}'
    license:
      # The component bundles works under several licenses that apply to
      # different files/resources, not jointly to one work.  The aggregate is
      # therefore NOASSERTION; `parts` records the actual scopes and `files`
      # carries the per-file SPDX labels.  The notices stay in the upstream
      # files and the full texts are shipped in licenses/uosc/.
      spdx: NOASSERTION
      scope: component-aggregate
      parts:
        - license: LGPL-2.1-or-later
          scope: 'uosc scripts and UI, except the files and snippet listed below'
        - license: Apache-2.0
          scope: 'portable_config/fonts/uosc_icons.otf (Material Icons Round)'
        - license: MIT
          scope: 'portable_config/scripts/uosc/lib/fzy.lua'
        - license: MPL-2.0
          scope: 'MPL-2.0 snippet inside portable_config/scripts/uosc/lib/utils.lua'
      files:
        # `ref` may be a tag, branch or short commit, but it is resolved to a
        # full commit at resolve time.  The lock, INDEX.json and download URL
        # only ever contain that commit; floating branches never reach a build.
        - path: LICENSE.LGPL
          license: LGPL-2.1-or-later
          repository: tomasklaen/uosc
          ref: '{release_tag}'
        # uosc_icons.otf is Material Icons Round (Copyright Google LLC).
        - path: Material-Icons-Apache-2.0.txt
          license: Apache-2.0
          repository: google/material-design-icons
          ref: master
          source_path: LICENSE
        # lib/fzy.lua is the MIT-licensed Lua fzy implementation by Seth Warn.
        - path: MIT-fzy.txt
          license: MIT
          repository: swarn/fzy-lua
          ref: main
          source_path: LICENSE
        # lib/utils.lua includes an MPL-2.0 snippet from po5/thumbfast.
        - path: MPL-2.0.txt
          license: MPL-2.0
          repository: po5/thumbfast
          ref: master
          source_path: LICENSE
    extract:
      type: zip
    install:
      - source: scripts/uosc
        target: portable_config/scripts/uosc
        tree: true
      - source: fonts
        target: portable_config/fonts
        tree: true
    platform_binaries:
      # uosc 5.x ships optional Go helpers for clipboard and subtitle search.
      # Keep only the binary for the platform being packaged.  The build-time
      # UI-scale patch is applied to the Lua source by build/patch_uosc.py.
      windows-x64:
        - scripts/uosc/bin/ziggy-windows.exe
      linux-x64:
        - scripts/uosc/bin/ziggy-linux
