schema: 1
# Upstream scripts and their assets.  uosc is fetched from its official
# release; the build applies one small, documented patch to
# portable_config/scripts/uosc/main.lua (build/patch_uosc.py) that adds the
# automatic UI scale.  All other uosc files remain upstream; see THIRD_PARTY.md.
# Local scripts live in scripts/local/ instead.
components:
  - id: uosc
    kind: archive
    platforms: all
    upstream: tomasklaen/uosc
    release:
      mode: latest
    asset:
      pattern: '^uosc\.zip$'
      version: '{release_tag}'
    license:
      # The component bundles works under several licenses that apply to
      # different files/resources, not jointly to one work.  The aggregate is
      # therefore NOASSERTION; `parts` records the actual scopes and `files`
      # carries the per-file SPDX labels.  The notices stay in the upstream
      # files and the full texts are shipped in licenses/uosc/.
      spdx: NOASSERTION
      scope: component-aggregate
      parts:
        - license: LGPL-2.1-or-later
          scope: 'uosc scripts and UI, except the files and snippet listed below'
        - license: Apache-2.0
          scope: 'portable_config/fonts/uosc_icons.otf (Material Icons Round)'
        - license: MIT
          scope: 'portable_config/scripts/uosc/lib/fzy.lua'
        - license: MPL-2.0
          scope: 'MPL-2.0 snippet inside portable_config/scripts/uosc/lib/utils.lua'
      files:
        - path: LICENSE.LGPL
          license: LGPL-2.1-or-later
          url: 'https://raw.githubusercontent.com/tomasklaen/uosc/{release_tag}/LICENSE.LGPL'
        # uosc_icons.otf is Material Icons Round (Copyright Google LLC).
        - path: Material-Icons-Apache-2.0.txt
          license: Apache-2.0
          url: 'https://raw.githubusercontent.com/google/material-design-icons/master/LICENSE'
        # lib/fzy.lua is the MIT-licensed Lua fzy implementation by Seth Warn.
        - path: MIT-fzy.txt
          license: MIT
          url: 'https://raw.githubusercontent.com/swarn/fzy-lua/master/LICENSE'
        # lib/utils.lua includes an MPL-2.0 snippet from po5/thumbfast.
        - path: MPL-2.0.txt
          license: MPL-2.0
          url: 'https://raw.githubusercontent.com/po5/thumbfast/master/LICENSE'
    extract:
      type: zip
    install:
      - source: scripts/uosc
        target: portable_config/scripts/uosc
        tree: true
      - source: fonts
        target: portable_config/fonts
        tree: true
    platform_binaries:
      # uosc 5.x ships optional Go helpers for clipboard and subtitle search.
      # Keep only the binary for the platform being packaged.  The build-time
      # UI-scale patch is applied to the Lua source by build/patch_uosc.py.
      windows-x64:
        - scripts/uosc/bin/ziggy-windows.exe
      linux-x64:
        - scripts/uosc/bin/ziggy-linux
