schema: 2
# GLSL shaders are data assets: nothing here is committed to the repository.
# build.resolve pins every raw file to a full upstream commit and a SHA-256;
# build.fetch downloads it from raw.githubusercontent.com during CI, and
# build.assemble installs it under portable_config/shaders/.
#
# Every component declares family, status, source commit and license.  AI
# shaders additionally declare model provenance (`model.required: true` plus
# the model licence text), because a code licence does not automatically cover
# embedded weights.  Only SAFE and SAFE_WITH_NOTICE components may live here;
# NONCOMMERCIAL, NO_REDISTRIBUTION, UNKNOWN and CLEAN_ROOM candidates are
# recorded in manifests/shader-audit.json and must not enter a package.
#
# Excluded on purpose (see docs/shader-license-audit.md):
#   - Ani4Kv2 / AniSD: code MIT but model weights are CC BY-NC 4.0.
#   - AnimeJaNai (the_database) ESRGAN models: CC BY-NC-SA 4.0.
#   - k7 modernAnime and other ESRGAN conversions: model-weight grant absent.
#   - QCOM SGEDS / SGSR: third-party conversions whose source chain is unclear.
#   - Shadertoy / Pastebin / gist-only shaders without an explicit licence.
#   - Ports that exist only as unlicensed hooke007 derivatives.
